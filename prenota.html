<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazioni GPP Group</title>
    <style>
        :root { 
            --blue: #003580; 
            --green: #25D366; 
            --gray: #f8f9fa; 
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #eef2f3; 
            margin: 0; 
            padding: 10px; 
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
        }
        h1 { 
            color: var(--blue); 
            text-align: center; 
            margin-bottom: 5px; 
            font-size: 1.8em; 
        }
        .sub { 
            text-align: center; 
            color: #555; 
            margin-bottom: 25px; 
            font-style: italic; 
            font-size: 0.9em; 
        }
        .section { 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            margin-bottom: 30px; 
            background: var(--gray); 
            overflow: hidden; 
        }
        .header { 
            background: var(--blue); 
            color: white; 
            padding: 12px 15px; 
            font-size: 1.2em; 
            font-weight: bold; 
            text-align: center; 
        }
        .frm { 
            padding: 20px; 
            background: white; 
        }
        .prices { 
            font-size: 0.9em; 
            margin-bottom: 15px; 
            border-left: 4px solid #ffc107; 
            padding-left: 10px; 
            line-height: 1.5; 
            color: #333; 
            background: #fffdf5;
            padding-top: 5px;
            padding-bottom: 5px;
        }
        label { 
            display: block; 
            margin: 10px 0 3px; 
            font-size: 0.85em; 
            font-weight: bold; 
            color: #444; 
        }
        input[type="text"], input[type="date"], select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            box-sizing: border-box; 
            margin-bottom: 10px; 
            font-size: 1em; 
        }
        .pet-option { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: #f0fdf4; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #bbf7d0; 
            margin: 15px 0; 
            font-size: 0.9em; 
        }
        .pet-option input { 
            width: auto; 
            cursor: pointer; 
            transform: scale(1.2); 
            margin: 0;
        }
        .btn-wa { 
            background: var(--green); 
            color: white; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            font-size: 1.1em; 
            transition: 0.2s; 
            text-decoration: none; 
        }
        .btn-wa:hover { 
            background: #1ebd5b; 
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Prenotazioni GPP Group</h1>
    <p class="sub">Calcola il preventivo e invia la richiesta su WhatsApp.</p>

    <div class="section">
        <div class="header">Configura il tuo Soggiorno</div>
        <div class="frm">
            
            <label>Seleziona Struttura:</label>
            <select id="casa" onchange="aggiornaOpzioniOspiti()">
                <option value="LUCA">LUCA</option>
                <option value="BIRI Trezzo">BIRI Trezzo</option>
                <option value="MAX Concesa">MAX Concesa</option>
                <option value="LEO Capriate">LEO Capriate</option>
                <option value="MARCO Canonica">MARCO Canonica</option>
                <option value="CRIS Trezzo">CRIS Trezzo</option>
                <option value="ASIA Dalmine">ASIA Dalmine</option>
                <option value="SIX Crespi">SIX Crespi</option>
            </select>

            <div class="prices" id="box-prezzi">
                </div>

            <label>Nome e Cognome:</label>
            <input type="text" id="nome" placeholder="Es. Mario Rossi">
            
            <label>Ospiti:</label>
            <select id="ospiti">
                </select>
            
            <label>Check-in:</label>
            <input type="date" id="cin">
            
            <label>Check-out:</label>
            <input type="date" id="cout">
            
            <div class="pet-option">
                <input type="checkbox" id="pet"> 
                <span>Porto un animale (+10€/giorno)</span>
            </div>
            
            <label>Metodo di Pagamento:</label>
            <select id="pagamento">
                <option value="Bonifico Istantaneo">Bonifico Istantaneo</option>
                <option value="Satispay">Satispay</option>
                <option value="PayPal">PayPal</option>
            </select>
            
            <button class="btn-wa" onclick="inviaWA()">📱 Calcola e Invia Richiesta</button>
        </div>
    </div>
</div>

<script>
// Database delle strutture per tenere aggiornati i prezzi sia nel box che nel calcolo
const listinoStrutture = {
    'LUCA': { p1: '1-2 Persone', p2: '3-5 Persone', note: '1-2 Pers: 80€ | 3-5 Pers: 95€<br>Pulizie: 20€/30€ | +10€/g Animale' },
    'BIRI Trezzo': { p1: '1-2 Persone', p2: '3-4 Persone', note: '1-2 Pers: 80€ | 3-4 Pers: 100€<br>Pulizie: 20€/30€ | +10€/g Animale' },
    'MAX Concesa': { p1: '1-2 Persone', p2: '3-4 Persone', note: '1-2 Pers: 65€ | 3-4 Pers: 80€<br>Pulizie: 20€/30€ | +10€/g Animale' },
    'LEO Capriate': { p1: '1-2 Persone', p2: '3-4 Persone', note: '1-2 Pers: 70€ | 3-4 Pers: 85€<br>Pulizie: 20€/30€ | +10€/g Animale' },
    'MARCO Canonica': { p1: '1-2 Persone', p2: '3-4 Persone', note: '1-2 Pers: 70€ | 3-4 Pers: 85€<br>Pulizie: 20€/30€ | +10€/g Animale' },
    'CRIS Trezzo': { p1: '1-3 Persone', p2: '4+ Persone', note: '1-3 Pers: 80€ | 4+ Pers: 100€<br>Pulizie: 20€/30€ | +10€/g Animale' },
    'ASIA Dalmine': { p1: '1-2 Persone', p2: '3-4 Persone', note: '1-2 Pers: 80€ | 3-4 Pers: 95€<br>Pulizie: 20€/30€ | +10€/g Animale' },
    'SIX Crespi': { p1: '1-3 Persone', p2: '4+ Persone', note: '1-3 Pers: 100€ | 4+ Pers: 130€<br>Pulizie: 20€/30€ | +10€/g Animale' }
};

function aggiornaOpzioniOspiti() {
    const casaSelezionata = document.getElementById('casa').value;
    const info = listinoStrutture[casaSelezionata];
    
    // Aggiorna il testo informativo dei prezzi
    document.getElementById('box-prezzi').innerHTML = info.note;
    
    // Aggiorna dinamicamente i valori del select ospiti
    const selectOspiti = document.getElementById('ospiti');
    selectOspiti.innerHTML = `
        <option value="${info.p1.toLowerCase()}">${info.p1}</option>
        <option value="${info.p2.toLowerCase()}">${info.p2}</option>
    `;
}

function inviaWA() {
    const casa = document.getElementById('casa').value;
    const nome = document.getElementById('nome').value.trim();
    const ospiti = document.getElementById('ospiti').value;
    const cin = document.getElementById('cin').value;
    const cout = document.getElementById('cout').value;
    const pet = document.getElementById('pet').checked;
    const pag = document.getElementById('pagamento').value;
    const tel = "393487668497"; 

    if(!nome || !cin || !cout) { 
        alert("Per favore, inserisci Nome, Check-in e Check-out"); 
        return; 
    }

    const dIn = new Date(cin);
    const dOut = new Date(cout);
    const diffTime = dOut - dIn;
    const notti = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

    if(notti <= 0) {
        alert("La data di check-out deve essere successiva al check-in!");
        return;
    }

    let prezzoNotte = 0;
    // Logica pulizie basata sulla stringa dell'opzione selezionata (1-2 o 1-3)
    let prezzoPulizie = (ospiti.includes('1-2') || ospiti.includes('1-3')) ? 20 : 30;

    // Logica Prezzi speculare alle condizioni precedenti
    if (casa === 'BIRI Trezzo') prezzoNotte = (ospiti.includes('1-2')) ? 80 : 100;
    else if (casa === 'MAX Concesa') prezzoNotte = (ospiti.includes('1-2')) ? 65 : 80;
    else if (casa === 'LEO Capriate' || casa === 'MARCO Canonica') prezzoNotte = (ospiti.includes('1-2')) ? 70 : 85;
    else if (casa === 'CRIS Trezzo') prezzoNotte = (ospiti.includes('1-3')) ? 80 : 100;
    else if (casa === 'ASIA Dalmine' || casa === 'LUCA') prezzoNotte = (ospiti.includes('1-2')) ? 80 : 95;
    else if (casa === 'SIX Crespi') prezzoNotte = (ospiti.includes('1-3')) ? 100 : 130;

    let totaleSoggiorno = prezzoNotte * notti;
    let costoAnimali = pet ? (10 * notti) : 0;
    let totaleGenerale = totaleSoggiorno + prezzoPulizie + costoAnimali;

    // Formattazione date in IT (DD/MM/YYYY)
    const d1 = cin.split("-").reverse().join("/");
    const d2 = cout.split("-").reverse().join("/");
    const petText = pet ? `🐾 Animale: SI (+${costoAnimali}€)` : "🐾 Animale: NO";
    
    // Costruzione stringa messaggio WhatsApp
    const msg = `Ciao GPP Group! %0AVorrei prenotare: *${casa}*%0A%0A👤 Nome: ${nome}%0A👥 Ospiti: ${ospiti.toUpperCase()}%0A📅 DAL: ${d1}%0A📅 AL: ${d2} (${notti} notti)%0A%0A--- DETTAGLIO ---%0A💰 Soggiorno: ${totaleSoggiorno}€ (${prezzoNotte}€/notte)%0A🧹 Pulizie: ${prezzoPulizie}€%0A${petText}%0A💳 Pagamento: *${pag}*%0A%0A🔥 *TOTALE: ${totaleGenerale}€*`;
    
    window.open(`https://wa.me/${tel}?text=${msg}`, '_blank');
}

// Esegui la funzione al caricamento della pagina per impostare la prima casa di default
window.onload = aggiornaOpzioniOspiti;
</script>

</body>
</html>
