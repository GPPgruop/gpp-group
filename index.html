<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPP Group | Short Rent Solutions</title>
    <style>
        body { margin: 0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; background: white; padding: 20px 0; }
        .container { max-width: 600px; padding: 20px; }
        
        /* Logo Principale */
        .main-logo { width: 100%; max-width: 200px; height: auto; margin-bottom: 20px; }
        
        h1 { font-size: 2rem; margin-bottom: 10px; color: #1a1a1a; }
        p { color: #666; line-height: 1.5; margin-bottom: 30px; }
        
        /* Bottone GPP Renters */
        .btn { 
            display: inline-block; background: #bfa37e; color: white; padding: 15px 30px; 
            text-decoration: none; border-radius: 5px; font-weight: bold; text-transform: uppercase; 
            margin-bottom: 50px;
        }

        /* Sezione Partner Orizzontale */
        .partners-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }
        .partner-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .initial { font-size: 1.5rem; font-weight: bold; color: #1a1a1a; }
        .wa-link { 
            display: flex; align-items: center; 
            text-decoration: none; color: #1a1a1a; font-size: 0.9rem; font-weight: bold;
            gap: 5px;
        }
        .wa-icon { width: 18px; height: 18px; }

        /* Sezione Pagamenti */
        .payment-section {
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .payment-section span {
            display: block; font-size: 11px; color: #999; margin-bottom: 15px; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .payment-logos { display: flex; justify-content: center; align-items: center; gap: 25px; }
        .payment-logos img { height: 25px; width: auto; }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .partners-row { gap: 15px; }
            .wa-link { font-size: 0.8rem; }
