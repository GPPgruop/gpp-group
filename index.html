<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #333; }
        .hero { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; padding: 20px; box-sizing: border-box; }
        .container { max-width: 600px; }
        h1 { font-weight: 700; font-size: 2.5rem; letter-spacing: -1px; margin-bottom: 10px; color: #1a1a1a; }
        p { font-size: 1.1rem; line-height: 1.6; color: #555; margin-bottom: 40px; }
        .btn { 
            display: inline-block; 
            background-color: #000; 
            color: #fff; 
            padding: 18px 40px; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover { background-color: #333; transform: translateY(-2px); }
        .footer { position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 0.8rem; opacity: 0.6; }
