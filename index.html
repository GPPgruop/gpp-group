<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPP Group | Short Rent Solutions</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; background: white; padding: 20px; box-sizing: border-box; }
        .container { max-width: 500px; width: 100%; }
        .main-logo { width: 180px; height: auto; margin-bottom: 30px; }
        
        .btn-group { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 40px; }
        
        .btn { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 280px; 
            padding: 15px 0; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            text-transform: uppercase; 
            transition: 0.3s;
        }
        
        .btn-gold { background: #bfa37e; color: white; height: 60px; }
        .btn-green { background: #25D366; color: white; min-height: 70px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2); }
        .btn-green .main-txt { font-size: 1.1rem; }
        .btn-green .sub-txt { font-size: 0.7rem; opacity: 0.9; font-weight: normal; margin-top: 2px; }
        .btn:hover { transform: translateY(-2px); opacity: 0.95; }

        /* Sezione WhatsApp con i 3 numeri */
        .wa-container { margin-bottom: 40px; }
        .wa-icon-main { width: 20px; height: 20px; margin-bottom: 10px; }
        .partners-row { display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
        .wa-link { text-decoration: none; color: #1a1a1a; font-size: 0.75rem; font-weight: bold; }

        /* Footer Pagamenti MODIFICATO */
        .payment-section { border-top: 1px solid #eee; padding-top: 20px; text-align: center; }
        .payment-logos { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 35px; /* Aumentato lo spazio per l'ingrandimento */
            margin-bottom: 15px; 
        }
        .payment-logos img { 
            height: 25px; 
            width: auto; 
            transform: scale(1.3); /* Ingrandisce del 30% */
        }
        .secure-txt { 
            display: block; 
            text-align: center; /* Forza la centratura */
            font-size: 11px; 
            color: #999; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }

        @media (max-width: 480px) { .partners-row { gap: 10px; } }
    </style>
</head>
<body>
    <div class="container">
        <img src="LOGO.jpg" alt="GPP Group Logo" class="main-logo">
        
        <div class="btn-group">
            <a href="https://sites.google.com/view/gpprenters/home?authuser=0" class="btn btn-gold">ENTRA</a>
            
            <a href="prenota.html" class="btn btn-green">
                <span class="main-txt">PRENOTA</span>
                <span class="sub-txt">ZERO COMMISSIONI</span>
            </a>
        </div>

        <div class="wa-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="wa-icon-main" alt="WhatsApp">
            <div class="partners-row">
                <a href="https://wa.me/393384234315" class="wa-link">+39 338 423 4315</a>
                <a href="https://wa.me/393487668497" class="wa-link">+39 348 766 8497</a>
                <a href="https://wa.me/393491088800" class="wa-link">+39 349 108 8800</a>
            </div>
        </div>

        <div class="payment-section">
            <div class="payment-logos">
                <img src="Immagine%202026-03-20%20085330.jpeg" alt="PayPal">
                <img src="logo-satispay-rosso.png" alt="Satispay">
            </div>
            <span class="secure-txt">Pagamenti sicuri</span>
        </div>
    </div>
</body>
</html>
