<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPP Group | Short Rent Solutions</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            text-align: center; 
            background-color: #ffffff; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .container { max-width: 500px; width: 100%; padding: 20px; }
        .main-logo { width: 180px; height: auto; margin-bottom: 30px; }
        
        .btn-group { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 40px; }
        
        /* Stile Unificato dei Bottoni (Font Bold come da mockup) */
        .btn { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 350px; 
            height: 90px; 
            text-decoration: none; 
            border-radius: 18px; 
            font-weight: 800;    
            text-transform: uppercase; 
            transition: all 0.3s ease;
        }
        
        .btn-gold { background: #bfa37e; color: white; }
        
        .btn-blue { 
            background: #98d9ea; 
            color: #1a1a1a; 
            border: 2px solid #2ecc71; 
            font-style: italic; 
        }
        
        .btn-green { background: #2ecc71; color: white; }
        
        .main-txt { font-size: 1.2rem; letter-spacing: 1px; }
        .sub-txt { font-size: 0.8rem; font-weight: 400; margin-top: 5px; }
        
        .btn:hover { transform: scale(1.02); opacity: 0.9; }

        /* Contatti WhatsApp con ICONA */
        .wa-container { margin-bottom: 40px; }
        .wa-icon-main { width: 30px; height: 30px; margin-bottom: 15px; }
        .partners-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .wa-link { 
            text-decoration: none; color: #1a1a1a; font-size: 0.85rem; font-weight: bold; 
            background: #f0f0f0; padding: 10px 15px; border-radius: 50px; 
        }

        /* Footer Pagamenti (RIPRISTINATO) */
        .payment-section { border-top: 1px solid #eee; padding-top: 30px; margin-top: 20px; text-align: center; }
        .payment-logos { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
        /* Assicurati che questi nomi di file siano corretti nella tua cartella */
        .payment-logos img { height: 25px; width: auto; } 
        .secure-txt { display: block; font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1.5px; margin: 0; }

        @media (max-width: 480px) {
            .partners-row { flex-direction: column; gap: 10px; }
            .wa-link { width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="LOGO.jpg" alt="GPP Group Logo" class="main-logo">
        
        <div class="btn-group">
            <a href="entra.html" class="btn btn-gold">
                <span class="main-txt">SCOPRI LE NOSTRE CASE</span>
            </a>
            
            <a href="calendari.html" class="btn btn-blue">
                <span class="main-txt">CALENDARI</span>
            </a>
            
            <a href="prenota.html" class="btn btn-green">
                <span class="main-txt">PRENOTA</span>
                <span class="sub-txt">ZERO COMMISSIONI</span>
            </a>
        </div>

        <div class="wa-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="wa-icon-main" alt="WhatsApp">
            <div class="partners-row">
                <a href="https://wa.me/393384234315" target="_blank" rel="noopener" class="wa-link">+39 338 423 4315</a>
                <a href="https://wa.me/393487668497" target="_blank" rel="noopener" class="wa-link">+39 348 766 8497</a>
                <a href="https://wa.me/393491088800" target="_blank" rel="noopener" class="wa-link">+39 349 108 8800</a>
            </div>
        </div>

        <div class="payment-section">
            <div class="payment-logos">
                <img src="Immagine%202026-03-20%20085330.jpeg" alt="PayPal">
                <img src="logo-satispay-rosso.png" alt="Satispay">
            </div>
            <p class="secure-txt">🛡️ Pagamenti sicuri garantiti</p>
        </div>
    </div>
</body>
</html>
