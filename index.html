<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPP Group | Short Rent Solutions</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            text-align: center; 
            background-color: #f8f9fa; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .container { max-width: 500px; width: 100%; background: white; padding: 40px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .main-logo { width: 180px; height: auto; margin-bottom: 30px; }
        
        .btn-group { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 40px; }
        
        /* Bottoni Identici */
        .btn { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 320px; 
            height: 80px; /* Altezza fissa per farli uguali */
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: bold; 
            text-transform: uppercase; 
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn-gold { background: #bfa37e; color: white; }
        .btn-green { background: #25D366; color: white; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2); }
        
        .main-txt { font-size: 1.1rem; letter-spacing: 1px; }
        .sub-txt { font-size: 0.75rem; opacity: 0.9; font-weight: normal; margin-top: 4px; }
        
        .btn:hover { transform: translateY(-3px); opacity: 0.9; box-shadow: 0 6px 20px rgba(0,0,0,0.1); }

        /* WhatsApp */
        .wa-container { margin-bottom: 40px; }
        .wa-icon-main { width: 24px; height: 24px; margin-bottom: 15px; }
        .partners-row { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
        .wa-link { 
            text-decoration: none; 
            color: #1a1a1a; 
            font-size: 0.8rem; 
            font-weight: bold; 
            background: #f0f0f0;
            padding: 8px 12px;
            border-radius: 50px;
            transition: 0.2s;
        }
        .wa-link:hover { background: #e2e2e2; }

        /* Pagamenti */
        .payment-section { border-top: 1px solid #eee; padding-top: 30px; text-align: center; }
        .payment-logos { display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 15px; }
        .payment-logos img { height: 25px; width: auto; filter: grayscale(0.2); }
        .secure-txt { display: block; text-align: center; font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1.5px; }

        @media (max-width: 480px) { 
            .partners-row { flex-direction: column; gap: 10px; } 
            .btn { width: 95%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="LOGO.jpg" alt="GPP Group Logo" class="main-logo">
        
        <div class="btn-group">
            <a href="entra.html" class="btn btn-gold">
                <span class="main-txt">SCOPRI LE NOSTRE CASE</span>
            </a>
            
            <a href="prenota.html" class="btn btn-green">
                <span class="main-txt">PRENOTA</span>
                <span class="sub-txt">ZERO COMMISSIONI</span>
            </a>
        </div>

        <div class="wa-container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" class="wa-icon-main" alt="WhatsApp">
            <div class="partners-row">
                <a href="https://wa.me/393384234315" target="_blank" rel="noopener" class="wa-link">+39 338 423 4315</a>
                <a href="https://wa.me/393487668497" target="_blank" rel="noopener" class="wa-link">+39 348 766 8497</a>
                <a href="https://wa.me/393491088800" target="_blank" rel="noopener" class="wa-link">+39 349 108 8800</a>
            </div>
        </div>

        <div class="payment-section">
            <div class="payment-logos">
                <img src="Immagine%202026-03-20%20085330.jpeg" alt="PayPal">
                <img src="logo-satispay-rosso.png" alt="Satispay">
            </div>
            <span class="secure-txt">🛡️ Pagamenti sicuri garantiti</span>
        </div>
    </div>
</body>
</html>
