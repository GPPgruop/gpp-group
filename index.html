<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPP Group | Pagamenti</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f4f4f4;
        }
        header {
            background: #2c3e50;
            color: white;
            padding: 2rem;
        }
        .container {
            background: white;
            margin: 20px auto;
            padding: 20px;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* SEZIONE LOGHI */
        .payment-methods {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #ddd;
        }
        .payment-methods img {
            height: 50px; /* Altezza dei loghi */
            margin: 10px 20px;
            vertical-align: middle;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <h1>GPP Group</h1>
    </header>

    <div class="container">
        <h2>Benvenuti</h2>
        <p>Sito in aggiornamento.</p>

        <div class="payment-methods">
            <p><strong>Metodi di pagamento accettati:</strong></p>
            
            <img src="Immagine%202026-03-20%20085330.jpeg" alt="PayPal">
            
            <img src="logo-satispay-rosso.png" alt="Satispay">
        </div>
    </div>

    <footer>
        &copy; 2024 GPP Group
    </footer>

</body>
</html>
