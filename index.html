<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPP Group | Short Rent Solutions</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; background: white; padding: 20px; }
        .container { max-width: 400px; width: 100%; }
        .main-logo { width: 180px; height: auto; margin-bottom: 40px; }
        
        .btn-group { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        
        .btn { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 280px; 
            padding: 15px 0; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            text-transform: uppercase; 
            transition: 0.3s;
        }
        
        /* Bottone Oro */
        .btn-gold { background: #bfa37e; color: white; height: 60px; }
        
        /* Bottone Verde con doppia riga */
        .btn-green { background: #25D366; color: white; min-height: 70px; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2); }
        .btn-green .main-txt { font-size: 1.1rem; }
        .btn-green .sub-txt { font-size: 0.7rem; opacity: 0.9; font-weight: normal; margin-top: 2px; }
        
        .btn:hover { transform: translateY(-2px); opacity: 0.95; }

        /* Footer Pagamenti */
        .payment-section { margin-top: 60px; border-top: 1px solid #eee; padding-top: 20px; }
        .payment-logos { display: flex; justify-content: center; align-items: center; gap: 25px; }
        .payment-logos img { height: 25px; width: auto; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <img src="LOGO.jpg" alt="GPP Group Logo" class="main-logo">
        
        <div class="btn-group">
            <a href="https://sites.google.com/view/gpprenters/home?authuser=0" class="btn btn-gold">
                ENTRA
            </a>
            
            <a href="prenota.html" class="btn btn-green">
                <span class="main-txt">PRENOTA</span>
                <span class="sub-txt">ZERO COMMISSIONI</span>
            </a>
        </div>

        <div class="payment-section">
            <div class="payment-logos">
                <img src="Immagine%202026-03-20%20085330.jpeg" alt="PayPal">
                <img src="logo-satispay-rosso.png" alt="Satispay">
            </div>
        </div>
    </div>
</body>
</html>
