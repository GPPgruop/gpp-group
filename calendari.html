<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilità Case | GPP Group</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: #ffffff; 
            color: #333; 
            text-align: center; 
            padding: 20px;
        }
        .header { margin-bottom: 40px; }
        .btn-back { 
            display: inline-block; 
            text-decoration: none; 
            color: #bfa37e; 
            font-weight: 800; 
            margin-bottom: 20px; 
            border: 2px solid #bfa37e; 
            padding: 10px 25px; 
            border-radius: 50px; 
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-back:hover { background: #bfa37e; color: white; }
        
        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 30px; 
            max-width: 1400px; 
            margin: 0 auto; 
        }
        
        .casa-card { 
            background: white; 
            border-radius: 18px; 
            padding: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            border-top: 6px solid #98d9ea; 
        }
        
        .casa-card h2 { 
            font-size: 1.3rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-bottom: 15px; 
            color: #1a1a1a;
        }
        
        .calendar-wrapper { 
            width: 100%; 
            height: 450px; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #eee; 
        }
        
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
